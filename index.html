<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Math 3 Warm Up</title>
<style>
  :root { --teal:#376f7a; --teal2:#4c8c8c; --cream:#fff4e6; --peach:#ffe6cc; --gold:#d99a3d; --ink:#263b40;
          --good:#2f7d4f; --goodbg:#e3f3e8; --bad:#a8432f; --badbg:#fbe5df; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:"Helvetica Neue", Arial, sans-serif; color:var(--ink); background:var(--cream); }
  .wrap { max-width:720px; margin:0 auto; padding:12px 14px; }
  .card { background:#fff; border:3px solid var(--teal2); border-radius:12px; padding:14px 16px; }
  .top { display:flex; justify-content:space-between; align-items:baseline; gap:8px; flex-wrap:wrap; margin:0 0 10px; }
  .title { margin:0; font-size:1.15rem; font-weight:700; color:var(--teal); }
  .date { font-size:.9rem; color:#5b6b6e; }
  .dots { display:flex; gap:6px; margin:0 0 12px; }
  .dot { flex:1; height:8px; border-radius:4px; background:#e9dccb; }
  .dot.now { background:var(--gold); } .dot.ok { background:var(--good); } .dot.no { background:var(--bad); }
  .skill { font-size:.8rem; text-transform:uppercase; letter-spacing:.04em; color:var(--teal2); font-weight:700; margin:0 0 4px; }
  .tag { display:inline-block; font-size:.75rem; background:var(--peach); border-radius:6px; padding:1px 6px; margin-left:6px; text-transform:none; letter-spacing:0; color:var(--ink); font-weight:600; }
  .q { font-size:1.25rem; font-weight:600; line-height:1.4; margin:0 0 12px; }
  .choices { display:grid; gap:8px; }
  .ch { text-align:left; font:inherit; font-size:1.05rem; padding:.6rem .8rem; border:2px solid #d9c9b3; border-radius:8px; background:#fff; color:var(--ink); cursor:pointer; }
  .ch:hover:not(:disabled) { border-color:var(--teal); background:#f4fbfb; }
  .ch:disabled { cursor:default; }
  .ch.right { border-color:var(--good); background:var(--goodbg); font-weight:700; }
  .ch.wrong { border-color:var(--bad); background:var(--badbg); }
  .fb { margin:12px 0 0; padding:10px 12px; border-radius:8px; line-height:1.4; }
  .fb.ok { background:var(--goodbg); } .fb.no { background:var(--badbg); }
  .btn { display:inline-block; font:inherit; font-size:1.05rem; background:var(--teal); color:#fff; border:none; border-radius:8px; padding:.6rem 1.3rem; cursor:pointer; text-decoration:none; margin-top:12px; }
  .btn:hover { background:#2b5962; }
  .btn.alt { background:var(--gold); }
  .btn.ghost { background:#fff; color:var(--teal); border:2px solid var(--teal); }
  .row { display:flex; gap:8px; flex-wrap:wrap; }
  label { display:block; font-weight:600; margin:10px 0 4px; }
  input, select { font:inherit; font-size:1rem; padding:.5rem .6rem; border:2px solid #d9c9b3; border-radius:8px; width:100%; background:#fff; color:var(--ink); }
  .score { font-size:2.4rem; font-weight:800; color:var(--teal); margin:4px 0; }
  .muted { color:#5b6b6e; font-size:.92rem; }
  .review { margin:10px 0 0; padding:0; list-style:none; }
  .review li { padding:6px 0; border-top:1px solid #f1dcc2; font-size:.95rem; }
  .practice { margin-top:14px; padding-top:10px; border-top:2px dashed #e5d3ba; }
  .cpbadge { display:inline-block; background:var(--gold); color:#fff; font-size:.75rem; text-transform:uppercase; letter-spacing:.05em; padding:2px 7px; border-radius:6px; vertical-align:2px; }
  .back { font:inherit; font-size:.9rem; background:none; border:none; color:var(--teal); cursor:pointer; padding:0; margin:0 0 8px; text-decoration:underline; }
  .back:hover { color:#2b5962; }
  .note { background:var(--peach); border-radius:8px; padding:8px 10px; margin-top:10px; font-size:.92rem; }
</style>
</head>
<body>
<div class="wrap"><div class="card" id="app"><p class="muted">Loading today's warm-up…</p></div></div>
<script>
/* ===================== SETTINGS ===================== */
/* PUB = the Math 3 sheet's "Publish to web" link, cut off right after "gid=".
   Publish Student View, Warm-Up Bank and Quizzes as CSV. While PUB is "", the page says warm-ups aren't set up yet. */
const PUB = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRrXCOIUr8fKl9qOtzrDlMKy-yx0mZeZZzolZUYFWpBNIdQMmRuFzKvTQw_VTGNUNaRU0_dStMHcQ5p/pub?single=true&output=csv&gid=";
const CSV_URL  = PUB + "1341448792";   // Student View (calendar)
const BANK_URL = PUB + "1963903127";   // Warm-Up Bank tab
const QUIZ_URL = PUB + "555000111";    // Quizzes tab (checkpoints)
const SCHOOL_YEAR_START = 2026;     // Aug–Dec = 2026, Jan–Jul = 2027
const PER_DAY = 5;                   // questions per warm-up
/* Score form (Google Form). Leave FORM_URL "" until the form is ready.
   FORM_URL = the form's ".../viewform" link; the ENTRY ids come from a pre-filled link. */
const FORM_URL = "https://docs.google.com/forms/d/e/1FAIpQLScpd2QxkRsm7Yl5Rwj-oxSgLczR57263ZmDUy6HRhya4SnILA/viewform";
const ENTRY = { name:"955562304", date:"311308184", warmup:"600833951", score:"2069432705" };
/* ==================================================== */

/* filled from the sheet when the page loads */
const BANKS = {};        // "C3U6": [questions]
const UNIT_NAMES = {};   // "C3U6": "Circles & Circular Functions"
const CHECKPOINTS = {};  // "U6-A": [questions]

const P = new URLSearchParams(location.search);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const store = { get(k){ try { return localStorage.getItem(k) || ""; } catch(e){ return ""; } },
                set(k,v){ try { localStorage.setItem(k,v); } catch(e){} } };

function parseCSV(t){const r=[];let row=[],f="",q=false;for(let i=0;i<t.length;i++){const c=t[i];
  if(q){if(c=='"'){if(t[i+1]=='"'){f+='"';i++;}else q=false;}else f+=c;}
  else if(c=='"')q=true;else if(c==','){row.push(f);f="";}else if(c=='\n'){row.push(f);r.push(row);row=[];f="";}else if(c!='\r')f+=c;}
  if(f||row.length){row.push(f);r.push(row);}return r;}
function toDate(s){const m=(s||"").match(/(\d{1,2})\/(\d{1,2})/);if(!m)return null;const mo=+m[1],d=+m[2];
  return new Date(mo>=7?SCHOOL_YEAR_START:SCHOOL_YEAR_START+1,mo-1,d);}

/* seeded random so a given warm-up always shows the same questions */
function hash(s){let h=2166136261;for(const c of s){h^=c.charCodeAt(0);h=Math.imul(h,16777619);}return h>>>0;}
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);
  t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function shuffle(a,r){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

/* "WU C3U6.3a" -> {unit:"C3U6", n:10 (day number in unit, 0-based)} */
function parseWU(title){
  const m=(title||"").match(/WU\s+([A-Z0-9]+)\.(\d+)([a-e])/i); if(!m) return null;
  const unit=m[1].toUpperCase(); if(!BANKS[unit]) return null;
  return {unit, n:(+m[2]-1)*5 + "abcde".indexOf(m[3].toLowerCase())};
}
/* Each student gets their own order through the unit's bank (seeded by their name),
   so classmates see different questions, a refresh shows the same set,
   and a student doesn't repeat a question until they've seen the whole bank. */
function pickSet(title, who){
  const w=parseWU(title); if(!w) return null;
  const bank=BANKS[w.unit], per=Math.max(1,Math.floor(bank.length/PER_DAY));
  const cycle=Math.floor(w.n/per), pos=w.n%per;
  const order=shuffle(bank.map((_,i)=>i), rng(hash(w.unit+"|"+cycle+"|"+(who||"").toLowerCase().replace(/\s+/g," "))));
  return {unit:w.unit, items:order.slice(pos*PER_DAY,pos*PER_DAY+PER_DAY).map(i=>bank[i])};
}
/* "Checkpoint C3U6-A" -> "U6-A";  "Checkpoint C4U1-A" -> "U1-A" */
function cpCode(title){
  const m=(title||"").match(/^Checkpoint\s+(?:C\d)?([A-Z0-9]+-[A-Z])\s*$/i); if(!m) return null;
  const c=m[1].toUpperCase(); return CHECKPOINTS[c]?c:null;
}
/* the checkpoint's own questions first, then the one before it in the same unit */
function cpPools(code){
  const unit=code.replace(/-[A-Z]$/,""), letter=code.slice(-1);
  const prev=unit+"-"+String.fromCharCode(letter.charCodeAt(0)-1);
  return {cur:CHECKPOINTS[code], prev:CHECKPOINTS[prev]||[]};
}
function pickCheckpoint(code, who, avoid){
  const {cur,prev}=cpPools(code), seen=new Set((avoid||[]).map(q=>q.q));
  const r=avoid?Math.random:rng(hash(code+"|"+(who||"").toLowerCase().replace(/\s+/g," ")));
  const freshCur=cur.filter(q=>!seen.has(q.q)), freshPrev=prev.filter(q=>!seen.has(q.q));
  let set=[...shuffle(freshCur,r), ...shuffle(freshPrev,r)].slice(0,PER_DAY);
  if(set.length<PER_DAY){                       // pool used up: allow repeats
    const rest=shuffle([...cur,...prev].filter(q=>!set.includes(q)),r);
    set=set.concat(rest).slice(0,PER_DAY);
  }
  return shuffle(set,r);
}
function randomSet(unit, avoid){
  const bank=BANKS[unit], seen=new Set((avoid||[]).map(q=>q.q));
  const fresh=bank.filter(q=>!seen.has(q.q));
  return shuffle(fresh.length>=PER_DAY?fresh:bank, Math.random).slice(0,PER_DAY);
}

const app=document.getElementById("app");
let state=null;   // {title, dateLabel, unit, items, i, results:[], scored}

function fmtDate(d){return d.toLocaleDateString("en-US",{weekday:"short",month:"numeric",day:"numeric"});}

function prep(items){
  return items.map(q=>({...q, order:shuffle([0,1,2,3],Math.random), correct:"ABCD".indexOf(q.ans)}));
}
/* scored warm-up: ask for name first, then build that student's set */
function begin(title, dateLabel){
  state={title,dateLabel,scored:true,attempt:1,i:0,results:[],cp:cpCode(title)};
  intro();
}
function attemptKey(){ return "wu_try|"+state.name.toLowerCase()+"|"+state.title; }

function intro(){
  const name=store.get("wu_name");
  app.innerHTML=`${backLink()}
    <div class="top"><p class="title">${state.cp?'<span class="cpbadge">Checkpoint</span> ':""}${esc(state.title)}</p><span class="date">${esc(state.dateLabel)}</span></div>
    <p style="margin:0">${state.cp
      ? `${PER_DAY} questions on what we've been learning in class. Each one shows the answer and an explanation after you pick.`
      : `${PER_DAY} quick questions on skills you already know. Each one shows the answer and an explanation after you pick.`}</p>
    <label for="nm">Your name</label><input id="nm" value="${esc(name)}" autocomplete="name">
    <button class="btn" id="go">Start ${state.cp?"checkpoint":"warm-up"}</button>`;
  document.getElementById("go").onclick=()=>{
    const n=document.getElementById("nm").value.trim();
    if(!n){alert("Please enter your name.");return;}
    store.set("wu_name",n); state.name=n;
    const prev=+store.get(attemptKey())||0;          // came back after finishing? give a new set
    if(state.cp){
      const first=pickCheckpoint(state.cp, n);
      if(prev>=1){ state.attempt=prev+1; state.items=prep(pickCheckpoint(state.cp, n, first)); }
      else state.items=prep(first);
    } else {
      const s=pickSet(state.title, n); state.unit=s.unit;
      if(prev>=1){ state.attempt=prev+1; state.items=prep(randomSet(s.unit, s.items)); }
      else state.items=prep(s.items);
    }
    ask();
  };
}

function dots(){
  return `<div class="dots">${state.items.map((_,k)=>{
    const r=state.results[k]; return `<span class="dot ${r===true?"ok":r===false?"no":k===state.i?"now":""}"></span>`;}).join("")}</div>`;
}

function ask(){
  const q=state.items[state.i];
  app.innerHTML=`${backLink()}
    <div class="top"><p class="title">${esc(state.title)}</p><span class="date">Question ${state.i+1} of ${state.items.length}</span></div>
    ${dots()}
    <p class="skill">${esc(q.skill)}${q.calc==="Yes"?'<span class="tag">Calculator OK</span>':""}</p>
    <p class="q">${esc(q.q)}</p>
    <div class="choices">${q.order.map(k=>`<button class="ch" data-k="${k}">${esc(q.ch[k])}</button>`).join("")}</div>
    <div id="after"></div>`;
  app.querySelectorAll(".ch").forEach(b=>b.onclick=()=>answer(+b.dataset.k));
}

function answer(k){
  const q=state.items[state.i], ok=k===q.correct;
  state.results[state.i]=ok;
  app.querySelectorAll(".ch").forEach(b=>{
    const bk=+b.dataset.k; b.disabled=true;
    if(bk===q.correct) b.classList.add("right"); else if(bk===k) b.classList.add("wrong");
  });
  const last=state.i===state.items.length-1;
  document.getElementById("after").innerHTML=`
    <div class="fb ${ok?"ok":"no"}"><b>${ok?"Correct!":"Not quite."}</b> ${ok?"":"The answer is <b>"+esc(q.ch[q.correct])+"</b>. "}${esc(q.expl)}</div>
    <button class="btn" id="next">${last?"See my score":"Next question"}</button>`;
  app.querySelector(".dots").outerHTML=dots();
  document.getElementById("next").onclick=()=>{ if(last) finish(); else { state.i++; ask(); } };
}

function finish(){
  const right=state.results.filter(Boolean).length, total=state.items.length;
  let submit="";
  const tryLabel=state.attempt>1?` (try ${state.attempt})`:"";
  if(state.scored){
    store.set(attemptKey(), String(state.attempt));
    state.scoreText=right+"/"+total+tryLabel;
    if(FORM_URL && ENTRY.score){
      const u=new URL(FORM_URL);
      const add=(id,v)=>{ if(id) u.searchParams.set("entry."+id,v); };
      u.searchParams.set("usp","pp_url");
      add(ENTRY.name,state.name); add(ENTRY.date,state.dateLabel);
      add(ENTRY.warmup,state.title); add(ENTRY.score,state.scoreText);
      submit=`<a class="btn alt" href="${esc(u.toString())}" target="_blank" rel="noopener">Submit my score ↗</a>
              <p class="muted">Opens a form with your score filled in. Press <b>Submit</b> on the form.</p>`;
    }
  }
  app.innerHTML=`${backLink()}
    <div class="top"><p class="title">${esc(state.title)}${esc(tryLabel)}</p><span class="date">${esc(state.dateLabel)}</span></div>
    ${dots()}
    <p class="score">${right} / ${total}</p>
    ${submit}
    <ul class="review">${state.items.map((q,k)=>`<li>${state.results[k]?"✅":"❌"} ${esc(q.q)} <span class="muted">— ${esc(q.ch[q.correct])}</span></li>`).join("")}</ul>
    <div class="practice">
      <button class="btn" id="retry">Try a new set</button>
      <p class="muted" style="margin:6px 0 0">A new set is ${PER_DAY} new questions and counts as another try.</p>
    </div>`;
  document.getElementById("retry").onclick=()=>{
    state.attempt++;
    state.items=prep(state.cp?pickCheckpoint(state.cp, state.name, state.items):randomSet(state.unit, state.items));
    state.i=0; state.results=[]; ask();
  };
}

/* ---------- home screen: today's warm-up + past ones to choose from ---------- */
let HOME={today:null,msg:"",past:[]};
function go(title,label){ try{ history.pushState({wu:title},""); }catch(e){} begin(title,label); }
function backHome(){ if(history.state && history.state.wu){ history.back(); } else home(); }
window.addEventListener("popstate",()=>home());
app.addEventListener("click",e=>{ if(e.target.closest(".back")) backHome(); });
const backLink=()=>`<button class="back" type="button">← All warm-ups</button>`;

function home(){
  const t=HOME.today;
  const opts=HOME.past.slice(-20).reverse().map(d=>{const x=d.wu||d.cp; return `<option value="${esc(x)}|${esc(d.label)}">${esc(d.label)} — ${esc(x)}</option>`;}).join("");
  app.innerHTML=`
    <p class="title" style="margin:0 0 6px">Warm Ups</p>
    ${t?`<p style="margin:0">Today, ${esc(t.label)}:</p>
         <button class="btn" id="today">${cpCode(t.title)?'<span class="cpbadge">Checkpoint</span> ':""}Start ${esc(t.title)}</button>`
       :`<p style="margin:0">${HOME.msg}</p>`}
    ${opts?`<label for="mk">Do a different day's warm-up or checkpoint:</label>
      <select id="mk"><option value="">Choose a day…</option>${opts}</select>`:""}`;
  const tb=document.getElementById("today"); if(tb) tb.onclick=()=>go(t.title,t.label);
  const mk=document.getElementById("mk");
  if(mk) mk.onchange=()=>{ if(!mk.value) return; const [x,label]=mk.value.split("|"); go(x,label); };
}

const getCSV=url=>fetch(url+"&t="+Date.now()).then(r=>{if(!r.ok)throw new Error(r.status);return r.text();}).then(parseCSV);

/* read a question tab: columns are found by their header names */
function readQuestions(rows, groupOf){
  const head=(rows[0]||[]).map(h=>h.trim().toLowerCase());
  const c=(...names)=>{                       // exact header name first, then "starts with"
    for(const n of names){const i=head.indexOf(n);if(i>=0)return i;}
    for(const n of names){const i=head.findIndex(h=>h.startsWith(n));if(i>=0)return i;}
    return -1;};
  const cQ=c("question"), cA=c("choice a"), cB=c("choice b"), cC=c("choice c"), cD=c("choice d"),
        cAns=c("correct answer","answer"), cEx=c("explanation"), cSk=c("concept / skill","skill"), cCalc=c("calculator");
  const out=[];
  rows.slice(1).forEach(r=>{
    const g=i=>i>=0?(r[i]||"").trim():"";
    const q={skill:g(cSk), q:g(cQ), ch:[g(cA),g(cB),g(cC),g(cD)], ans:g(cAns).toUpperCase(), expl:g(cEx), calc:/^y/i.test(g(cCalc))?"Yes":"No"};
    if(!q.q || q.ch.some(x=>!x) || !"ABCD".includes(q.ans) || q.ans.length!==1) return;   // skip incomplete rows
    const key=groupOf(r, head); if(key) out.push([key,q]);
  });
  return out;
}

if(!PUB){ app.innerHTML=`<p class="title">Warm Up</p><p>Math 3 warm-ups aren't set up yet. Check back soon!</p>`; }
else Promise.all([getCSV(CSV_URL), getCSV(BANK_URL), getCSV(QUIZ_URL)])
 .then(([rows, bankRows, quizRows])=>{
  /* Warm-Up Bank: unit from "Canvas bank" (WU Bank CP3U6 -> C3U6), name from "Topic" */
  const bh=(bankRows[0]||[]).map(h=>h.trim().toLowerCase());
  const iBank=bh.indexOf("canvas bank"), iTopic=bh.indexOf("topic");
  readQuestions(bankRows, r=>{
    const m=(r[iBank]||"").match(/CP(\d)(U\d+(?:L\d+)?)/i); if(!m) return null;
    const code=("C"+m[1]+m[2]).toUpperCase();
    if(!UNIT_NAMES[code]) UNIT_NAMES[code]=(r[iTopic]||"").replace(/^CP\d+U\d+(\s+L\d+)?\s*/i,"").trim();
    return code;
  }).forEach(([k,q])=>(BANKS[k]=BANKS[k]||[]).push(q));
  /* Quizzes: checkpoint from the ID column (U6-A-7 -> U6-A) */
  const qh=(quizRows[0]||[]).map(h=>h.trim().toLowerCase()), iID=qh.indexOf("id");
  readQuestions(quizRows, r=>{ const m=(r[iID]||"").trim().match(/^([A-Z0-9]+-[A-Z])-\d+$/i); return m?m[1].toUpperCase():null; })
    .forEach(([k,q])=>(CHECKPOINTS[k]=CHECKPOINTS[k]||[]).push(q));

  const head=rows[0]||[];
  const col=(name,fb)=>{const i=head.findIndex(h=>h.trim().toLowerCase()===name.toLowerCase());return i>=0?i:fb;};
  const cD=1, cT=col("Topic",2), cW=col("Warm Up",3), cC=col("Checkpoint",col("Quiz",4));
  const days=[];
  rows.slice(1).forEach(r=>{const d=toDate(r[cD]); if(d) days.push({d,label:fmtDate(d),topic:r[cT]||"",wu:(r[cW]||"").trim(),cp:(r[cC]||"").trim()});});
  const today=P.get("date")?new Date(P.get("date")+"T00:00:00"):new Date(); today.setHours(0,0,0,0);
  const ok=title=>parseWU(title)||cpCode(title);
  const past=days.filter(x=>x.d<today && (parseWU(x.wu)||cpCode(x.cp)));
  const lastUnit=(()=>{const w=[...days].filter(x=>x.d<=today && parseWU(x.wu)).pop()||days.find(x=>parseWU(x.wu)); return w?parseWU(w.wu).unit:"";})();

  const t=days.find(x=>x.d.getTime()===today.getTime());
  const todayTitle=t?(cpCode(t.cp)?t.cp:(parseWU(t.wu)?t.wu:"")):"";
  let msg="There's no warm-up today.";
  if(!t) msg="There's no class today, so there's no warm-up.";
  else if(/no school/i.test(t.topic)) msg="There's no school today.";
  HOME={today:todayTitle?{title:todayTitle,label:t.label}:null,msg,past};
  try{ history.replaceState({home:1},""); }catch(e){}

  const asked=P.get("wu");     // ?wu=WU%20C3U6.3a or ?wu=Checkpoint%20C3U6-A opens that one
  if(asked && ok(asked)){
    const day=days.find(x=>x.wu===asked||x.cp===asked);
    return go(asked, day?day.label:"");
  }
  if(HOME.today) return go(HOME.today.title, HOME.today.label);
  home();
 })
 .catch(()=>{ app.innerHTML=`<p class="title">Warm Up</p><p>Couldn't load today's warm-up. Refresh the page or tell your teacher.</p>`; });
</script>
</body>
</html>
